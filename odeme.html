<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ödeme — MalikYayın</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0B0710; --card:#171020; --card-line:#2A1F38; --ink:#F5EEFA; --muted:#9C8BAE; --pink:#FF2D78; --purple:#7C3AED; --red:#FF5A5A; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .wrap{ width:100%; max-width:480px; text-align:center; }
  .logo{ display:flex; align-items:center; justify-content:center; gap:9px; font-weight:700; font-size:18px; margin-bottom:20px; font-family:'Space Grotesk',sans-serif; }
  .logo-dot{ width:9px; height:9px; border-radius:50%; background:linear-gradient(135deg,var(--pink),var(--purple)); }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:22px; margin:0 0 8px; }
  p{ color:var(--muted); font-size:14px; margin:0 0 24px; }
  #status{ padding:40px 20px; border:1px solid var(--card-line); border-radius:16px; background:var(--card); }
  button{ padding:13px 24px; border:none; border-radius:10px; font-weight:600; font-size:14px; cursor:pointer;
    background:linear-gradient(135deg,var(--pink),var(--purple)); color:#fff; font-family:inherit; }
  iframe{ width:100%; height:640px; border:none; border-radius:16px; background:#fff; }
  .err{ color:var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><span class="logo-dot"></span>MalikYayın</div>
  <h1>30 Günlük KEY — ₺70</h1>
  <p>Ödeme, PayTR'nin güvenli ödeme sayfası üzerinden alınır. Kart bilgilerin MalikYayın sunucularına hiç ulaşmaz.</p>
  <div id="status">
    <p>Ödeme sayfası hazırlanıyor...</p>
  </div>
</div>

<script>
  const API_BASE = window.MALIKYAYIN_API_BASE || 'https://api.malikyayin.com';
  const token = localStorage.getItem('my_token');
  const statusEl = document.getElementById('status');

  if(!token){
    statusEl.innerHTML = `<p class="err">Önce giriş yapmalısın.</p><button onclick="location.href='giris.html'">Giriş Yap</button>`;
  } else {
    fetch(`${API_BASE}/api/payment/paytr/init`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization': 'Bearer ' + token }
    })
    .then(r => r.json())
    .then(data => {
      if(!data.ok) throw new Error(data.error || 'Ödeme başlatılamadı.');
      statusEl.outerHTML = `<iframe id="status" src="${data.iframeUrl}" frameborder="0"></iframe>`;
    })
    .catch(e => {
      statusEl.innerHTML = `<p class="err">${e.message}</p><button onclick="location.reload()">Tekrar Dene</button>`;
    });
  }
</script>
</body>
</html>
