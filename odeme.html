<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ödeme — MalikYayın</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070B14; --card:#111827; --card-line:#1E2A3A; --ink:#E8F0FF; --muted:#8BA3C7;
    --cyan:#22D3EE; --violet:#A78BFA; --red:#F87171;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
    background-image:
      radial-gradient(500px 350px at 20% 10%, rgba(34,211,238,.1), transparent 55%),
      radial-gradient(500px 350px at 80% 90%, rgba(167,139,250,.1), transparent 55%);
  }
  .wrap{ width:100%; max-width:480px; text-align:center; }
  .logo{
    display:flex; align-items:center; justify-content:center; gap:9px;
    font-weight:700; font-size:18px; margin-bottom:20px; font-family:'Space Grotesk',sans-serif;
  }
  .logo-dot{ width:9px; height:9px; border-radius:50%; background:linear-gradient(135deg,var(--cyan),var(--violet)); }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:22px; margin:0 0 8px; }
  p{ color:var(--muted); font-size:14px; margin:0 0 24px; }
  #status{ padding:40px 20px; border:1px solid var(--card-line); border-radius:16px; background:var(--card); }
  button{
    padding:13px 24px; border:none; border-radius:10px; font-weight:600; font-size:14px; cursor:pointer;
    background:linear-gradient(135deg,var(--cyan),var(--violet)); color:#061018; font-family:inherit;
  }
  iframe{ width:100%; height:640px; border:none; border-radius:16px; background:#fff; }
  .err{ color:var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><span class="logo-dot"></span>MalikYayın</div>
  <h1>30 Günlük KEY — ₺70</h1>
  <p>Ödeme, PayTR’nin güvenli ödeme sayfası üzerinden alınır. Kart bilgilerin MalikYayın sunucularına hiç ulaşmaz.</p>
  <div id="status">
    <p>Ödeme sayfası hazırlanıyor...</p>
  </div>
</div>

<script src="config.js"></script>
<script>
  const API_BASE = (typeof window.MALIKYAYIN_API_BASE === 'string' ? window.MALIKYAYIN_API_BASE : '').replace(/\/$/, '');
  const PAYTR_READY = window.MALIKYAYIN_PAYTR_READY === true;
  const token = localStorage.getItem('my_token');
  const statusEl = document.getElementById('status');

  if(!PAYTR_READY){
    statusEl.innerHTML = `<p style="color:var(--muted)">Ödeme sistemi <b style="color:var(--ink)">yakında</b> aktif olacak.</p>
      <p style="color:var(--muted);font-size:13px;margin-top:8px">PayTR mağaza onayı tamamlanınca buradan KEY satın alabileceksin. Hesabın kayıtlı kalır.</p>
      <button onclick="location.href='index.html'" style="margin-top:12px">Ana sayfa</button>`;
  } else if(!token){
    statusEl.innerHTML = `<p class="err">Önce giriş yapmalısın.</p><button onclick="location.href='giris.html'">Giriş Yap</button>`;
  } else {
    let pkg = {};
    try { pkg = JSON.parse(localStorage.getItem('my_pkg') || '{}'); } catch(e) {}
    fetch(`${API_BASE}/api/payment/paytr/init`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ days: pkg.days || 30, price: pkg.price || 70 })
    })
    .then(r => r.json())
    .then(data => {
      if(!data.ok) throw new Error(data.error || 'Ödeme başlatılamadı.');
      statusEl.outerHTML = `<iframe id="status" src="${data.iframeUrl}" frameborder="0"></iframe>`;
    })
    .catch(e => {
      statusEl.innerHTML = `<p class="err">${e.message}</p><button onclick="location.reload()">Tekrar Dene</button>`;
    });
  }
</script>
</body>
</html>
