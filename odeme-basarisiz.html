<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ödeme Başarısız — MalikYayın</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#070B14; --card:#111827; --card-line:#1E2A3A; --ink:#E8F0FF; --muted:#8BA3C7; --cyan:#22D3EE; --violet:#A78BFA; --red:#F87171; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{ max-width:420px; text-align:center; background:var(--card); border:1px solid var(--card-line); border-radius:18px; padding:36px 28px; }
  .icon{ font-size:42px; margin-bottom:12px; }
  h1{ font-family:'Space Grotesk',sans-serif; font-size:22px; margin:0 0 10px; color:var(--red); }
  p{ color:var(--muted); font-size:14.5px; margin:0 0 24px; line-height:1.6; }
  a{
    display:inline-block; padding:12px 22px; border-radius:10px; font-weight:600; font-size:14px;
    background:linear-gradient(135deg,var(--cyan),var(--violet)); color:#061018; text-decoration:none;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✕</div>
  <h1>Ödeme tamamlanamadı</h1>
  <p>İşlem iptal edildi veya başarısız oldu. Kartından ücret çekilmediyse tekrar deneyebilirsin. Sorun devam ederse destek ile iletişime geç.</p>
  <a href="odeme.html">Tekrar dene</a>
</div>
</body>
</html>
