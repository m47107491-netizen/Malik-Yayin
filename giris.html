<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş Yap — MalikYayın</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070B14; --card:#111827; --card-line:#1E2A3A; --ink:#E8F0FF; --muted:#8BA3C7;
    --cyan:#22D3EE; --violet:#A78BFA; --gold:#FBBF24; --green:#34D399; --red:#F87171;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink);
    background-image:
      radial-gradient(600px 400px at 15% 8%, rgba(34,211,238,.14), transparent 60%),
      radial-gradient(700px 500px at 85% 25%, rgba(167,139,250,.14), transparent 60%);
  }
  h1{ font-family:'Space Grotesk',sans-serif; letter-spacing:-0.02em; }
  .card{
    width:100%; max-width:380px; background:var(--card); border:1px solid var(--card-line);
    border-radius:20px; padding:32px; margin:24px;
  }
  .logo{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:18px; margin-bottom:22px; font-family:'Space Grotesk',sans-serif; }
  .logo-dot{ width:9px; height:9px; border-radius:50%; background:linear-gradient(135deg,var(--cyan),var(--violet)); box-shadow:0 0 14px rgba(34,211,238,.7); }
  h1{ font-size:22px; margin:0 0 6px; }
  .sub{ color:var(--muted); font-size:13.5px; margin:0 0 24px; }
  label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; }
  input{
    width:100%; padding:13px 14px; border-radius:10px; border:1px solid var(--card-line);
    background:#0A101C; color:var(--ink); font-size:15px; font-family:inherit; margin-bottom:16px;
  }
  input:focus{ outline:none; border-color:var(--cyan); }
  .code-input{ letter-spacing:8px; font-size:20px; text-align:center; font-family:'Space Grotesk',sans-serif; }
  button{
    width:100%; padding:14px; border:none; border-radius:10px; font-weight:600; font-size:14.5px;
    cursor:pointer; font-family:inherit;
    background:linear-gradient(135deg,var(--cyan),var(--violet)); color:#061018;
  }
  button:disabled{ opacity:.55; cursor:not-allowed; }
  .link-btn{ background:none; color:var(--muted); margin-top:14px; font-size:13px; text-decoration:underline; }
  .msg{ font-size:13px; margin:-6px 0 16px; min-height:16px; }
  .msg.err{ color:var(--red); }
  .msg.ok{ color:var(--green); }
  .step{ display:none; }
  .step.active{ display:block; }
  a.back{ display:inline-block; margin-top:18px; font-size:13px; color:var(--muted); text-decoration:none; }
  a.back:hover{ color:var(--cyan); }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="logo-dot"></span>MalikYayın</div>

  <div class="step active" id="step-email">
    <h1>Giriş yap / Hesap oluştur</h1>
    <p class="sub">E-posta adresini yaz, sana 6 haneli bir giriş kodu gönderelim.</p>
    <label for="name">Adın (isteğe bağlı)</label>
    <input id="name" type="text" placeholder="Örn. Malik">
    <label for="email">E-posta</label>
    <input id="email" type="email" placeholder="ornek@eposta.com" required>
    <div class="msg err" id="email-msg"></div>
    <button id="send-btn" onclick="sendCode()">Kod Gönder</button>
  </div>

  <div class="step" id="step-code">
    <h1>Kodunu gir</h1>
    <p class="sub" id="code-sub">E-postana gönderdiğimiz 6 haneli kodu gir. Kod 10 dakika geçerlidir.</p>
    <input id="code" class="code-input" type="text" inputmode="numeric" maxlength="6" placeholder="000000">
    <div class="msg err" id="code-msg"></div>
    <button id="verify-btn" onclick="verifyCode()">Giriş Yap</button>
    <button class="link-btn" onclick="resetToEmail()">← Farklı e-posta kullan</button>
  </div>

  <div class="step" id="step-done">
    <h1>Hoş geldin 👋</h1>
    <p class="sub" id="done-msg"></p>
    <button onclick="location.href='odeme.html'">KEY Al — ₺70</button>
    <a class="back" href="index.html">← Ana sayfaya dön</a>
  </div>
</div>

<script>
  const API_BASE = window.MALIKYAYIN_API_BASE || 'https://api.malikyayin.com';
  let currentEmail = '';

  function show(step){
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById(step).classList.add('active');
  }

  function setMsg(id, text, ok=false){
    const el = document.getElementById(id);
    el.textContent = text || '';
    el.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  async function sendCode(){
    const email = document.getElementById('email').value.trim();
    const name = document.getElementById('name').value.trim();
    setMsg('email-msg', '');
    if(!/^\S+@\S+\.\S+$/.test(email)){
      setMsg('email-msg', 'Geçerli bir e-posta adresi gir.');
      return;
    }
    const btn = document.getElementById('send-btn');
    btn.disabled = true; btn.textContent = 'Gönderiliyor...';
    try{
      const r = await fetch(`${API_BASE}/api/auth/send-code`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email, name })
      });
      const data = await r.json();
      if(!r.ok) throw new Error(data.error || 'Kod gönderilemedi.');
      currentEmail = email;
      document.getElementById('code-sub').textContent = `${email} adresine 6 haneli kodu gönderdik.`;
      show('step-code');
    }catch(e){
      setMsg('email-msg', e.message);
    }finally{
      btn.disabled = false; btn.textContent = 'Kod Gönder';
    }
  }

  async function verifyCode(){
    const code = document.getElementById('code').value.trim();
    setMsg('code-msg', '');
    if(code.length !== 6){ setMsg('code-msg', '6 haneli kodu gir.'); return; }
    const btn = document.getElementById('verify-btn');
    btn.disabled = true; btn.textContent = 'Doğrulanıyor...';
    try{
      const r = await fetch(`${API_BASE}/api/auth/verify-code`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email: currentEmail, code })
      });
      const data = await r.json();
      if(!r.ok) throw new Error(data.error || 'Kod doğrulanamadı.');
      localStorage.setItem('my_token', data.token);
      localStorage.setItem('my_user', JSON.stringify(data.user));
      document.getElementById('done-msg').textContent = data.user.license && data.user.license.active
        ? `${data.user.name}, KEY'in aktif — uygulamayı açıp giriş yapabilirsin.`
        : `${data.user.name}, hesabın hazır. Uygulamayı kullanmak için bir KEY satın al.`;
      show('step-done');
    }catch(e){
      setMsg('code-msg', e.message);
    }finally{
      btn.disabled = false; btn.textContent = 'Giriş Yap';
    }
  }

  function resetToEmail(){ show('step-email'); }
</script>
</body>
</html>
